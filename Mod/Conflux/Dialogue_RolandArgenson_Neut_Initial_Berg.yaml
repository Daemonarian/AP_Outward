replace:
- Berg/_SNPC/_UNPC/UNPC_RolandArgenson/Dialogue_RolandArgenson/NPC/DialogueTree_1_Initial

type: dialogue

blackboard:
  gInstigator: character

data:
  actors:
    name_unpc_rolandargenson_01: 40fbaef3-4bf8-4bc9-bf2f-ae0d25ded760

threads:
  start:
  # ensure that Roland gift 2 is not skippable
  - if:
      condition:
        and:
        - hasQuestEvent: General_DoneQuest0
        - not:
            hasQuestEvent: General_RolandGift2
      then:
      - goto: gift2

  # ensure that Roland gift 3 is not skippable
  - if:
      condition:
        and:
        - hasQuestEvent: General_DoneQuest1
        - not:
            hasQuestEvent: General_RolandGift3
      then:
      - goto: gift3
    
  # fallback to normal dialogue tree
  - if:
      condition:
        hasQuestEvent: WhispBones_RolandLich
      then:
      - do:
          branch:
            dialogue:
              name: Dialogue_RolandArgenson_BB/BC_WhisperingBonesLich
      - finish
  - if:
      condition:
        and:
        - hasQuestEvent: Faction_BlueChamber
        - knowQuest: Whispering_Bones
        - hasQuestEvent: WhispBones_StartTimer
      then:
      - do:
          branch:
            dialogue:
              name: Dialogue_RolandArgenson_BB/BC_WhisperingBonesChe
  - say:
      actor: name_unpc_rolandargenson_01
      statement:
        meta: Roland_BC_Prequest_13
        text: "I'm getting better day by day...It's still hopeless, but at least I can survive like this, even if it's just barely. I'll keep trying to make it up to you, [PlayerName], I promise."

  gift2:
  - say:
      actor: name_unpc_rolandargenson_01
      statement:
        meta: Roland_BC_Prequest_16
        text: "[PlayerName]! It's good to see you! I almost didn't make it to Berg in one piece. Some metal golem dog things nearly got me! If a passing hunter hadn't save me...Hoooh."
  - do:
      sequence:
      - sendLocationCheck: ROLAND_GIFT_2
      - sendQuestEvent: General_RolandGift2
      - sendQuestEvent: WhispBones_RolandFocus
  - say:
      actor: name_unpc_rolandargenson_01
      statement:
        meta: Roland_BC_Prequest_17
        text: "He gave me some stuff to make traps and told me to use them, and my brain if I'm not good at fighting. But I'd rather try to get good at fighting than rely on using these tricky things. I nearly impaled myself last time I tried arming one."
  - goto: thank

  gift3:
  - if:
      condition:
        hasQuestEvent: CallToAdventure_QuestEndedB
      then:
      - say:
          actor: name_unpc_rolandargenson_01
          statement:
            meta: Roland_BC_Prequest_15
            text: "I stumbled on a small cache of gems the other day. I know this should go to my Blood Price Payment, but...You lost your home because of me. I think you need this more than me. Go on, take it."
      - do:
          sequence:
          - sendLocationCheck: ROLAND_GIFT_3
          - sendQuestEvent: General_RolandGift3
          - sendQuestEvent: WhispBones_RolandFocus
      else:
      - say:
          actor: name_unpc_rolandargenson_01
          statement:
            meta: Roland_BC_Prequest_14
            text: "Oh! [PlayerName]! I found this on a hunter's corpse not too far out from town. It's still got his blood on it, but...It's still usable!"
      - do:
          sequence:
          - sendLocationCheck: ROLAND_GIFT_3
          - sendQuestEvent: General_RolandGift3
          - sendQuestEvent: WhispBones_RolandFocus
  - goto: thank

  thank:
  - choice:
    - statement:
        text: Thanks, Roland.
        meta: Player_Roland_BC_Prequest_a_14
    - statement:
        text: You should look after yourself Roland, keep it.
        meta: Player_Roland_BC_Prequest_b_14
      then:
      - say:
          actor: name_unpc_rolandargenson_01
          statement:
            meta: Roland_BC_Prequest_18
            text: "No. I insist. Take it. I want to make up for the shipwreck I got you caught in."
